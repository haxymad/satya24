[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
satya-core = { path = "../satya-core" }
satya-parsers = { path = "../satya-parsers" }
satya-trust = { path = "../satya-trust" }
serde.workspace = true
serde_json.workspace = true
