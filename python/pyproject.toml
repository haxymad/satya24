[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satya-forensics"
version = "0.1.0"
description = "SATYA Python layer: ML inference + Rust bridge"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "onnxruntime>=1.17",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
xai = ["torch>=2.2", "torchvision>=0.17", "captum>=0.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
satya-py = "dvr_forensics.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dvr_forensics*"]

[tool.ruff]
line-length = 100
target-version = "py310"
