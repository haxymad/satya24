[workspace]
members = [
    "crates/satya-core",
    "crates/satya-image",
    "crates/satya-parsers",
    "crates/satya-recover",
    "crates/satya-trust",
    "crates/satya-anchors",
    "crates/satya-custody",
    "crates/satya-video",
    "crates/satya-report",
    "crates/satya-api",
    "crates/satya-mcp",
    "crates/satya-desktop",
    "crates/satya-cli",
    "crates/satya-ml-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
binrw = "0.14"
memchr = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
regex = "1"
printpdf = "0.7"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.15", features = ["server", "transport-io", "macros"] }
schemars = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
