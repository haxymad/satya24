[workspace]
members = [
    "crates/satya-core",
    "crates/satya-parsers",
    "crates/satya-recover",
    "crates/satya-cli",
    "crates/satya-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
binrw = "0.14"
memchr = "2"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
